
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK UAM 관제탑</title>
  <style>
    /* 기본 스타일 및 다크 테마 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #080f1a;
      color: #00ffcc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #1a2f4c;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00ffcc;
    }

    /* 언어 선택 드롭다운 */
    select {
      background: #0d1b2a;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
    }

    /* 메인 대시보드 그리드 (모바일 기본: 1열) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      flex: 1;
    }

    /* 카드 기본 공통 스타일 */
    .card {
      background: #0d1b2a;
      border: 1px solid #1a3a5c;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 레이더 영역 */
    .radar-card {
      align-items: center;
      min-height: 320px;
      position: relative;
    }

    .card-title {
      align-self: flex-start;
      font-size: 1rem;
      color: #88a0c0;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .radar-display {
      width: 200px;
      height: 200px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.05) 0%, rgba(0,0,0,0) 70%);
      margin: 10px 0;
    }

    .target-dot {
      width: 10px;
      height: 10px;
      background-color: #ff3366;
      border-radius: 50%;
      position: absolute;
      top: 40%;
      right: 35%;
      box-shadow: 0 0 10px #ff3366;
    }

    .tracking-status {
      font-size: 0.95rem;
      color: #00ffcc;
      margin-top: 12px;
      font-weight: 500;
    }

    /* 상태 지표 카드 영역 */
    .metrics-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .metric-card {
      background: #0d1b2a;
      border: 1px solid #1a3a5c;
      border-radius: 8px;
      padding: 16px 20px;
    }

    .metric-label {
      font-size: 0.95rem;
      color: #88a0c0;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 2.2rem; /* 글자 크기 대폭 확대 */
      font-weight: 700;
      color: #ffffff;
    }

    .metric-unit {
      font-size: 1.1rem;
      color: #00ffcc;
      margin-left: 4px;
    }

    /* 태블릿 및 PC용 미디어 쿼리 (화면 가로 폭이 넓어질 때 2열 배치) */
    @media (min-width: 768px) {
      body {
        padding: 24px;
      }

      .dashboard-grid {
        grid-template-columns: 2fr 1fr;
      }

      .brand-title {
        font-size: 1.5rem;
      }

      .radar-display {
        width: 260px;
        height: 260px;
      }

      .metric-value {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 관제탑 헤더 -->
  <header>
    <div class="brand-title" data-i18n="headerTitle">HK UAM 관제탑</div>
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="ko" selected>한국어</option>
      <option value="en">English</option>
    </select>
  </header>

  <!-- 메인 대시보드 레이아웃 -->
  <main class="dashboard-grid">
    
    <!-- 좌측: 공중 레이더 스코프 -->
    <section class="card radar-card">
      <div class="card-title" data-i18n="radarTitle">공중 레이더 스코프</div>
      <div class="radar-display">
        <div class="target-dot"></div>
      </div>
      <div class="tracking-status">
        <span data-i18n="targetLabel">표적 추적 중:</span> <strong>HK-AERO-01</strong>
      </div>
    </section>

    <!-- 우측: 핵심 수치 모니터링 카드 -->
    <section class="metrics-container">
      
      <!-- 비행 고도 -->
      <div class="metric-card">
        <div class="metric-label" data-i18n="altitude">비행 고도</div>
        <div class="metric-value">450 <span class="metric-unit">m</span></div>
      </div>

      <!-- 대지 속도 -->
      <div class="metric-card">
        <div class="metric-label" data-i18n="speed">대지 속도</div>
        <div class="metric-value">180 <span class="metric-unit">km/h</span></div>
      </div>

      <!-- 배터리 잔량 -->
      <div class="metric-card">
        <div class="metric-label" data-i18n="power">배터리 잔량</div>
        <div class="metric-value">92 <span class="metric-unit">%</span></div>
      </div>

    </section>

  </main>

  <!-- i18n 언어 전환 스크립트 -->
  <script>
    const translations = {
      ko: {
        headerTitle: "HK UAM 관제탑",
        radarTitle: "공중 레이더 스코프",
        targetLabel: "표적 추적 중:",
        altitude: "비행 고도",
        speed: "대지 속도",
        power: "배터리 잔량"
      },
      en: {
        headerTitle: "HK UAM COMMAND TOWER",
        radarTitle: "AIRSPACE RADAR SCOPE",
        targetLabel: "TARGET TRACKING:",
        altitude: "FLIGHT ALTITUDE",
        speed: "GROUND SPEED",
        power: "POWER CELL"
      }
    };

    function changeLanguage(lang) {
      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
    }
  </script>

</body>
</html>
