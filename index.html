<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HK Glass OS | Elite HUD</title>
  <style>
    :root { --primary: #38bdf8; --bg: #050a14; --glass: rgba(255, 255, 255, 0.05); }
    body { background: var(--bg); color: #fff; margin: 0; font-family: 'Inter', -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* 글래스 모피즘 헤더 */
    .header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
    .title { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; }

    /* 고급 언어 선택창 */
    .lang-select { background: rgba(0,0,0,0.6); border: 1px solid var(--primary); color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; cursor: pointer; }

    /* 메인 HUD 영역 */
    .hud-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    
    /* 중앙 포커스 포인트 */
    .focus-ring { width: 150px; height: 150px; border: 2px solid var(--primary); border-radius: 50%; position: relative; animation: pulse 3s infinite; }
    .focus-ring::after { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 50%; }

    /* 데이터 대시보드 */
    .data-card { margin-top: 40px; background: var(--glass); backdrop-filter: blur(10px); padding: 20px 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    
    /* 하단 버튼 바 */
    .nav-bar { padding: 30px; display: flex; justify-content: center; gap: 20px; }
    .btn { background: var(--glass); border: 1px solid var(--primary); color: var(--primary); padding: 12px 30px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 600; }
    .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }
  </style>
</head>
<body>

<div class="header">
  <div class="title" id="txt-title">HK GLASS OS</div>
  <select class="lang-select" onchange="updateUI(this.value)">
    <option value="ko">🇰🇷 한국어</option>
    <option value="en">🇺🇸 English</option>
    <option value="zh">🇨🇳 中文</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="hi">🇮🇳 हिन्दी</option>
    <option value="es">🇪🇸 Español</option>
    <option value="pt">🇧🇷 Português</option>
    <option value="uk">🇺🇦 Українська</option>
    <option value="ja">🇯🇵 日本語</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="vi">🇻🇳 Tiếng Việt</option>
    <option value="th">🇹🇭 ภาษาไทย</option>
    <option value="id">🇮🇩 Indonesia</option>
    <option value="ps">🇵🇸 فلسطين</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="it">🇮🇹 Italiano</option>
    <option value="fr">🇫🇷 Français</option>
  </select>
</div>

<div class="hud-main">
  <div class="focus-ring"></div>
  <div class="data-card">
    <h2 id="txt-monitor">SYSTEM READY</h2>
    <p id="txt-status">Neural Link: Stable</p>
  </div>
</div>

<div class="nav-bar">
  <button class="btn" id="btn-nav">NAVIGATE</button>
  <button class="btn" id="btn-robot">ROBOT</button>
  <button class="btn" id="btn-call">CONNECT</button>
</div>

<script>
  const data = {
    ko: { title: "HK 글래스 OS", monitor: "시스템 가동 중", status: "뉴럴 링크: 안정적", nav: "항로 탐색", rbt: "로봇 제어", call: "연결" },
    en: { title: "HK GLASS OS", monitor: "SYSTEM READY", status: "Neural Link: Stable", nav: "NAVIGATE", rbt: "ROBOT", call: "CONNECT" },
    zh: { title: "HK 玻璃 OS", monitor: "系统就绪", status: "神经链接: 稳定", nav: "导航", rbt: "机器人", call: "连接" },
    ar: { title: "HK GLASS OS", monitor: "النظام جاهز", status: "الرابط العصبي: مستقر", nav: "الملاحة", rbt: "روبوت", call: "اتصال" },
    hi: { title: "HK GLASS OS", monitor: "सिस्टम तैयार", status: "न्यूरल लिंक: स्थिर", nav: "नेविगेट", rbt: "रोबोट", call: "कनेक्ट" },
    es: { title: "HK GLASS OS", monitor: "SISTEMA LISTO", status: "Enlace Neural: Estable", nav: "NAVEGAR", rbt: "ROBOT", call: "CONECTAR" },
    pt: { title: "HK GLASS OS", monitor: "SISTEMA PRONTO", status: "Link Neural: Estável", nav: "NAVEGAR", rbt: "ROBÔ", call: "CONECTAR" },
    uk: { title: "HK GLASS OS", monitor: "СИСТЕМА ГОТОВА", status: "Нейронний зв'язок: Стабільний", nav: "НАВІГАЦІЯ", rbt: "РОБОТ", call: "ПІДКЛЮЧИТИ" },
    ja: { title: "HK ガラス OS", monitor: "システム準備完了", status: "ニューラルリンク: 安定", nav: "ナビ", rbt: "ロボット", call: "接続" },
    ru: { title: "HK GLASS OS", monitor: "СИСТЕМА ГОТОВА", status: "Нейросеть: Стабильна", nav: "НАВИГАЦИЯ", rbt: "РОБОТ", call: "ПОДКЛЮЧИТЬ" },
    vi: { title: "HK GLASS OS", monitor: "HỆ THỐNG SẴN SÀNG", status: "Liên kết thần kinh: Ổn định", nav: "ĐỊNH VỊ", rbt: "ROBOT", call: "KẾT NỐI" },
    th: { title: "HK GLASS OS", monitor: "ระบบพร้อม", status: "การเชื่อมต่อทางประสาท: เสถียร", nav: "นำทาง", rbt: "หุ่นยนต์", call: "เชื่อมต่อ" },
    id: { title: "HK GLASS OS", monitor: "SISTEM SIAP", status: "Link Neural: Stabil", nav: "NAVIGASI", rbt: "ROBOT", call: "KONEKSI" },
    ps: { title: "HK GLASS OS", monitor: "سیسټم چمتو دی", status: "عصبي لینک: ثابت", nav: "نویګیشن", rbt: "روبوټ", call: "وصلول" },
    de: { title: "HK GLASS OS", monitor: "SYSTEM BEREIT", status: "Neuronale Verbindung: Stabil", nav: "NAVIGIEREN", rbt: "ROBOTER", call: "VERBINDEN" },
    it: { title: "HK GLASS OS", monitor: "SISTEMA PRONTO", status: "Link Neurale: Stabile", nav: "NAVIGAZIONE", rbt: "ROBOT", call: "CONNETTI" },
    fr: { title: "HK GLASS OS", monitor: "SYSTÈME PRÊT", status: "Lien Neuronal: Stable", nav: "NAVIGUER", rbt: "ROBOT", call: "CONNECTER" }
  };

  function updateUI(lang) {
    const d = data[lang];
    document.getElementById('txt-title').innerText = d.title;
    document.getElementById('txt-monitor').innerText = d.monitor;
    document.getElementById('txt-status').innerText = d.status;
    document.getElementById('btn-nav').innerText = d.nav;
    document.getElementById('btn-robot').innerText = d.rbt;
    document.getElementById('btn-call').innerText = d.call;
  }
</script>
</body>
</html>
