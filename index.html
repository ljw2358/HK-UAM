<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">HK UAM 관제탑</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            
            /* SF 네온 칼라 */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --neon-purple: #a855f7;
            --neon-yellow: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            padding: 15px;
            min-height: 100vh;
        }

        /* Header (모바일 깨짐 완벽 방지 반영) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            white-space: nowrap;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .lang-select {
            background: #0f172a;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* 모바일 반응형 처리 */
        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .header h1 {
                font-size: 1.15rem;
                width: 100%;
            }

            .header-controls {
                width: 100%;
                justify-content: flex-end;
            }

            .lang-select {
                width: 100%;
                max-width: 180px;
            }
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        /* UAM Radar Card */
        .radar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            position: relative;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.15);
        }

        .radar-title {
            position: absolute;
            top: 18px;
            left: 18px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--neon-green);
            letter-spacing: 0.5px;
        }

        .radar-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px dashed var(--neon-green);
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, rgba(0, 240, 255, 0.05) 50%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            animation: rotateRadar 12s linear infinite;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .radar-dot {
            width: 12px;
            height: 12px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-pink);
            transform: translate(30px, -20px);
        }

        .radar-footer {
            margin-top: 22px;
            font-size: 0.85rem;
            color: var(--neon-green);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Status Cards */
        .status-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-alt {
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }

        .card-speed {
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .status-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-value {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .val-cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .val-green {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="title">HK UAM 관제탑</h1>
        <div class="header-controls">
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ko" selected>한국어 (KR)</option>
                <option value="en">English (US)</option>

                <option value="de">Deutsch (DE)</option>
                <option value="it">Italiano (IT)</option>

            </select>
        </div>
    </header>

    <main class="dashboard-grid">
        <section class="card radar-card">

            </div>
            <div class="radar-footer" id="radar-footer">표적 추적 중: HK-AERO-01</div>
        </section>

        <section class="status-card card-alt">
            <div class="status-label" id="lbl-alt">비행 고도</div>
            <div class="status-value">
                <span id="val-altitude">450</span> 
                <span class="val-green" style="font-size:1rem;">m</span>
            </div>
        </section>

        <section class="status-card card-speed">
            <div class="status-label" id="lbl-speed">대지 속도</div>
            <div class="status-value">
                <span id="val-speed">180</span> 
                <span class="val-cyan" style="font-size:1rem;">km/h</span>
            </div>
        </section>
    </main>
